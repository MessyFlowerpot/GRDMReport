<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.D.M. 漏洞反馈中心</title>
    <style>
        /* 现代企业级UI风格 - 清爽、专业 */
        body {
            background-color: #f5f7fa;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #0066cc;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: #1a1a1a;
            font-size: 24px;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #0066cc;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .captcha-group {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        .captcha-question {
            font-weight: bold;
            color: #0066cc;
            min-width: 80px;
        }

        /* 蜜罐字段 - 隐藏 */
        .honeypot {
            display: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.submit-btn:hover {
            background-color: #0052a3;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>G.R.D.M. 漏洞反馈中心</h1>
        <p>感谢您协助我们完善我们的产品</p>
    </div>

    <!-- 蜜罐字段：人类看不见，机器人会填 -->
    <input type="text" name="website_url" class="honeypot" />

    <form id="bugReportForm">
        <!-- 1. Bug取名 -->
        <div class="form-group">
            <label for="bugTitle">Bug 取名</label>
            <input type="text" id="bugTitle" placeholder="概括Bug主要内容" required>
        </div>

        <!-- 2. 漏洞描述 -->
        <div class="form-group">
            <label for="bugDesc">漏洞描述（让我们了解问题）</label>
            <textarea id="bugDesc" rows="4" placeholder="请简要描述您遇到的异常情况..." required></textarea>
        </div>

        <!-- 3. 触发过程复述 -->
        <div class="form-group">
            <label for="bugSteps">触发过程复述（让我们更好排查问题）</label>
            <textarea id="bugSteps" rows="5" placeholder="1. 第一步做了什么...&#10;2. 第二步点击了哪里..." required></textarea>
        </div>

        <!-- 4. 安全验证 -->
        <div class="form-group">
            <label>安全验证</label>
            <div class="captcha-group">
                <span id="mathQuestion" class="captcha-question"></span>
                <input type="number" id="mathAnswer" placeholder="输入计算结果" required>
            </div>
        </div>

        <button type="submit" class="submit-btn">提交反馈报告</button>
    </form>

    <div class="footer">
        &copy; G.R.D.M. 工程技术部 | 依据 PZ801 标准构建
    </div>
</div>

<script>
    // 生成随机数学题
    let num1 = Math.floor(Math.random() * 20);
    let num2 = Math.floor(Math.random() * 20);
    let correctAnswer = num1 + num2;
    
    document.getElementById('mathQuestion').textContent = `${num1} + ${num2} = ?`;

    // 处理表单提交
    document.getElementById('bugReportForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. 检查蜜罐字段
        if (document.querySelector('input[name="website_url"]').value !== '') {
            alert('系统检测：非人类操作，已拦截。');
            return;
        }

        // 2. 检查数学题答案
        if (parseInt(document.getElementById('mathAnswer').value) !== correctAnswer) {
            alert('验证失败：数学题计算错误，请重试。');
            return;
        }

        // 3. 验证通过
        const bugTitle = document.getElementById('bugTitle').value;
        alert('提交成功！\n\n关于"' + bugTitle + '"的报告已发送至 G.R.D.M. 服务器。\n感谢您的反馈，我们将尽快排查！');
    });
</script>

</body>
</html>
