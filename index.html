<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.D.M. 漏洞反馈中心</title>
    <style>
        body {
            background-color: #f5f7fa;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #0066cc;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

            .header h1 {
                margin: 0;
                color: #1a1a1a;
                font-size: 24px;
            }

            .header p {
                color: #666;
                font-size: 14px;
                margin-top: 10px;
            }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

            input:focus, textarea:focus {
                border-color: #0066cc;
                outline: none;
                box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            }

        .captcha-group {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        .captcha-question {
            font-weight: bold;
            color: #0066cc;
            min-width: 80px;
        }

        .honeypot {
            display: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

            button.submit-btn:hover:not(:disabled) {
                background-color: #0052a3;
            }

            button.submit-btn:disabled {
                background-color: #99ccff;
                cursor: not-allowed;
            }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>G.R.D.M. 漏洞反馈中心</h1>
            <p>感谢您协助我们完善我们的产品</p>
        </div>
        <input type="text" name="website_url" class="honeypot" />
        <form id="bugReportForm">
            <div class="form-group">
                <label for="bugTitle">Bug 取名</label>
                <input type="text" id="bugTitle" placeholder="给您遇到的Bug起个标题总结" required>
            </div>
            <div class="form-group">
                <label for="bugDesc">漏洞描述</label>
                <textarea id="bugDesc" rows="4" placeholder="请简要描述您遇到的异常情况..." required></textarea>
            </div>
            <div class="form-group">
                <label for="bugSteps">触发过程复述</label>
                <textarea id="bugSteps" rows="5" placeholder="1. 第一步做了什么...&#10;2. 第二步点击了哪里..." required></textarea>
            </div>
            <div class="form-group">
                <label>安全验证</label>
                <div class="captcha-group">
                    <span id="mathQuestion" class="captcha-question"></span>
                    <input type="number" id="mathAnswer" placeholder="输入计算结果" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">提交反馈报告</button>
        </form>
        <div class="footer">&copy; G.R.D.M. 工程技术部 | 依据 PZ801 "信息交流与上传" 标准构建</div>
    </div>

    <script>
                // ============ 核心：智能寻址系统 ============
                // 这次是真的填进去了！
        const TUNNEL_URL = "https://hiking-prints-destination-truck.trycloudflare.com";

                let apiUrl = '/submit'; // 默认走本地/隧道
                if (window.location.hostname.includes('github.io')) {
                    apiUrl = TUNNEL_URL + '/submit'; // 如果在 GitHub 上，就去隧道
                }
                // ====================================

                let num1 = Math.floor(Math.random() * 20);
                let num2 = Math.floor(Math.random() * 20);
                let correctAnswer = num1 + num2;
                document.getElementById('mathQuestion').textContent = `${num1} + ${num2} = ?`;

                document.getElementById('bugReportForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    if (document.querySelector('input[name="website_url"]').value !== '') {
                        alert('系统检测：非人类操作，已拦截。'); return;
                    }
                    if (parseInt(document.getElementById('mathAnswer').value) !== correctAnswer) {
                        alert('验证失败：数学题计算错误，请重试。'); return;
                    }

                    const submitBtn = document.querySelector('.submit-btn');
                    submitBtn.disabled = true;
                    submitBtn.textContent = "正在发送至 G.R.D.M. 总部...";

                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                title: document.getElementById('bugTitle').value,
                                desc: document.getElementById('bugDesc').value,
                                steps: document.getElementById('bugSteps').value
                            })
                        });
                        const result = await response.json();
                        if (result.status === 'success') {
                            alert(` 提交成功！\n\n关于“${document.getElementById('bugTitle').value}”的报告已发送至 G.R.D.M. 服务器。`);
                            document.getElementById('bugReportForm').reset();
                            num1 = Math.floor(Math.random() * 20); num2 = Math.floor(Math.random() * 20);
                            correctAnswer = num1 + num2;
                            document.getElementById('mathQuestion').textContent = `${num1} + ${num2} = ?`;
                        } else {
                            alert(' 提交失败：服务器返回异常。');
                        }
                    } catch (error) {
                        alert(' 提交失败：G.R.D.M. 接收站当前离线，请稍后再试！');
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "提交反馈报告";
                    }
                });
    </script>
</body>
</html>
